# Codename: Michelle
name: wikiSpyder CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Syntax check
        run: python -m py_compile __main__.py main.py newwindow.py setup.py

      - name: Import smoke test
        run: python -c "import main, newwindow; import pytestqt"
